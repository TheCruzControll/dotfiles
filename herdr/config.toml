onboarding = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[ui]
status_indicators = "dots"
mouse_capture = true

[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
